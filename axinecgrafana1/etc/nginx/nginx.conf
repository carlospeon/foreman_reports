
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    #worker_connections  1024;
    worker_connections  2048;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '"$upstream_cache_status" "$request_time"' ;


    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay     on;

    keepalive_timeout  65;
    types_hash_max_size 2048;

    gzip  on;

    proxy_temp_path /dev/shm/nginx-tmp;
    proxy_cache_path /dev/shm/nginx-cache levels=1:2 keys_zone=general:16m inactive=8h max_size=64m;
    proxy_cache_methods GET HEAD;

    client_max_body_size 128m;

    proxy_read_timeout 300;
    # proxy_connect_timeout 300;
    proxy_send_timeout 300;


    #include /etc/nginx/conf.d/*.conf;


    upstream grafana {
        keepalive 200;

        server 127.0.0.1:3000;
    }
    upstream alerta-api {
        keepalive 200;

        server 127.0.0.1:5000;
    }
    upstream influx {
        keepalive 200;

        server 10.110.52.18:8086 ;
        server 10.110.52.21:8086 ; 
        #server 10.110.52.21:8086 backup;
    }
    upstream axinzbxsecweb {
        keepalive 200;

        server 10.110.12.55:443;
    }
    upstream alertmanager {
        keepalive 200;

        server 127.0.0.1:9093;
    }

    ssl_certificate /etc/pki/tls/certs/axinecinfluxv1-inditex-chain.pem;
    ssl_certificate_key /etc/pki/tls/private/axinecinfluxv1.key;
    ssl_session_timeout  5m;

    server {
        listen      80;
	listen      443 default_server ssl http2;
        server_name  localhost;

        #ssl_certificate /etc/pki/tls/certs/axinecinfluxv1-inditex-chain.pem;
        #ssl_certificate_key /etc/pki/tls/private/axinecinfluxv1.key;
        #ssl_session_timeout  5m;

        #ssl_protocols  SSLv2 SSLv3 TLSv1;
        #ssl_protocols  TLSv1.3 TLSv1.2;
        #ssl_ciphers  HIGH:!aNULL:!MD5;
        #ssl_ciphers  AES128-SHA256:AES256-SHA256:AES256-SHA:AES128-SHA;
        #ssl_prefer_server_ciphers   on;

        gzip on;
        gzip_proxied any;
        gzip_types text/css text/javascript text/xml text/plain application/javascript application/x-javascript application/json;

        proxy_cache general;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_lock_age 15s;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout invalid_header updating;

        proxy_buffers 8 2m;
        proxy_buffer_size 12m;
        proxy_busy_buffers_size 12m;
        client_body_buffer_size 12m;

        large_client_header_buffers 4 32k;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        #set $host_request_uri "${http_host}${request_uri}";
	#if ($host_request_uri = 'axinecinfluxv1.central.inditex.grp/login') {
	#	return 302 https://axinecinfluxv1.ecommerce.inditex.grp/login;
        #}
	if ($http_host != 'axinecinfluxv1.ecommerce.inditex.grp') {
		return 302 https://axinecinfluxv1.ecommerce.inditex.grp$request_uri;
	}

        location /alerta-api/ {
                proxy_pass http://alerta-api/;
        }
        location /alerta {
                include /etc/nginx/security-headers.conf;
                root /var/www/html/;
                try_files $uri $uri/ /alerta/index.html;
        }
        location /alertmanager/ {
                proxy_pass http://alertmanager/;
        }

        location /avatar/ {
                proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie;
                proxy_hide_header Set-Cookie;

		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto "https";

                expires 1d;
                proxy_cache_valid 200 2d;
                proxy_pass http://grafana;
        }


        location /api/datasources/proxy/1/query {
                proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie;
                proxy_hide_header Set-Cookie;

		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto "https";

                expires 10s;
                proxy_cache_valid 200 20s;
                proxy_pass http://grafana;
        }

        location /api/live/ws {
               return 403;
        }

        #location /render {
        #       return 403;
        #}

	location /server-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.110.52.13;
            allow 10.110.52.22;
            deny all;
            add_header Access-Control-Allow-Origin "*";
        }

        location / {
                include /etc/nginx/security-headers.conf;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto "https";
                proxy_pass http://grafana;
        }

    }

    server {
        listen      80;
	listen      443 ssl http2;
        server_name  satreports.ecommerce.inditex.grp satreports;

        gzip on;
        gzip_proxied any;
        gzip_types text/css text/javascript text/xml text/plain application/javascript application/x-javascript application/json;

        proxy_cache general;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_lock_age 15s;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout invalid_header updating;

        proxy_buffers 8 2m;
        proxy_buffer_size 12m;
        proxy_busy_buffers_size 12m;
        client_body_buffer_size 12m;

        large_client_header_buffers 4 32k;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

	root /var/www/foreman_reports;

        location /api {
                include /etc/nginx/security-headers.conf;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto "https";
                proxy_pass http://127.0.0.1:3100;
        }

    }

    server {
        listen 8086;
        server_name influx;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        gzip on;
        gzip_proxied any;
        gzip_types text/css text/javascript text/xml text/plain application/javascript application/x-javascript application/json;
	#gzip_min_length 1000;
	#gunzip on;

        location / {
          proxy_pass https://influx;
        }
    }
    server {
        listen 10443 ssl;
        server_name axinzbxsecweb;

        #ssl                  on;

        ssl_certificate /etc/pki/tls/certs/axinecgrafana1-inditex-chain.pem;
        ssl_certificate_key /etc/pki/tls/private/axinecgrafana1.key;

        ssl_session_timeout  5m;

        ssl_protocols  TLSv1.2;
        ssl_ciphers  AES128-SHA256:AES256-SHA256:AES256-SHA:AES128-SHA;
        ssl_prefer_server_ciphers   on;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        location / {
          proxy_pass https://axinzbxsecweb;
        }
    }

}
